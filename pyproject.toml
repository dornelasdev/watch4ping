[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watch4ping"
dynamic = ["version"]
description = "Monitor an internet connection with ping and generate session reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "dornelas" }
]
keywords = ["internet", "monitoring", "ping", "network", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "twine>=6.0",
]

[project.scripts]
watch4ping = "watch4ping.cli:main"

[tool.hatch.version]
path = "src/watch4ping/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/watch4ping"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/watch4ping.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
