name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

  package:
    name: Build and verify package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install packaging tools
        run: python -m pip install --upgrade ".[dev]"

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Install wheel in a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/watch4ping-wheel"
          "${RUNNER_TEMP}/watch4ping-wheel/bin/python" -m pip install dist/*.whl

      - name: Verify installed package and CLI outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          "${RUNNER_TEMP}/watch4ping-wheel/bin/python" -c "import watch4ping; print(watch4ping.__version__)"
          "${RUNNER_TEMP}/watch4ping-wheel/bin/watch4ping" --version
